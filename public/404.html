<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Opening Star Battle 1 solver…</title>
    <script>
      // GitHub Pages has no server-side SPA rewrite. Preserve the requested
      // page and return to the Vite entry point, which restores it on load.
      sessionStorage.setItem("star-battle-pages-redirect", window.location.pathname + window.location.search + window.location.hash);
      window.location.replace("/star_battle_solver/");
    </script>
  </head>

</html>
